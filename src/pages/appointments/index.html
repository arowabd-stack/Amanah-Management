<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>আমানাহ সেন্টার · রোগী ব্যবস্থাপনা</title>
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="/readability.css">
<link rel="stylesheet" href="/assets/css/address-autocomplete.css">

<body data-entry="appointments">

<!-- ============ LOGIN ============ -->
<div id="login">
 <form class="box" id="loginForm">
  <h1>আমানাহ সেন্টার</h1>
  <p>রোগী ব্যবস্থাপনা · স্টাফ লগইন</p>
  <div style="text-align:left"><label for="lpUser">ইউজার নাম</label><input id="lpUser" autocomplete="username" value="admin"></div>
  <div style="text-align:left;margin-top:10px"><label for="lpPass">পাসওয়ার্ড</label><input id="lpPass" type="password" autocomplete="current-password" placeholder="Cloud Admin Password"></div>
  <button class="btn pri" style="width:100%;justify-content:center;margin-top:14px" type="submit">প্রবেশ করুন</button>
  <div class="err" id="lpErr"></div>
 </form>
</div>

<!-- ============ APP ============ -->
<div class="shell" id="shell" hidden>
 <aside class="side">
  <div class="logo">আমানাহ সেন্টার</div>
  <div class="tag">ইসলামিক হিজামা ও রুকইয়া</div>
  <nav class="nav" id="nav"></nav>
  <div class="bot"><a class="btn sm" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.3)" id="logout">লগআউট</a></div>
 </aside>
 <main class="main" id="main"></main>
</div>
<nav class="tabs" id="tabs"></nav>

<div class="modal" id="modal" hidden><div class="box" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<div id="printArea"></div>


<script src="/assets/js/core.js"></script>
<script src="/assets/js/pages/dashboard.js"></script>
<script src="/assets/js/pages/patients.js"></script>
<script src="/assets/js/pages/new-visit.js"></script>

<script src="/assets/js/pages/appointments.js"></script>
<script src="/assets/js/pages/accounts.js"></script>
<script src="/assets/js/pages/settings.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/address-directory.js"></script>
<script src="/assets/js/address-autocomplete.js"></script>
<script src="/assets/js/hijri-live.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="/pricing.js"></script>
<script src="/cloud.js"></script>

</html>
